# Fork-only: builds the image on every push to main and publishes it to
# ghcr.io/prangel85/split-pro. Skipped in any other repository.
name: Publish fork image to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-ghcr-fork
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish
    if: github.repository == 'Prangel85/split-pro'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/prangel85/split-pro
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=fork-${{ github.sha }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
